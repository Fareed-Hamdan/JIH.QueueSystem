# Full local installation: Oracle Database 23ai Free + application + nginx.
#   cp .env.example .env    (then edit the passwords)
#   docker compose up -d --build
#   open http://<server-ip>:8080   (first start: Oracle needs 1–3 minutes)
name: jih-queue

services:
  oracle-db:
    # Community image of Oracle Database Free (23ai). It creates APP_USER automatically.
    # Official alternative: container-registry.oracle.com/database/free:latest (see docs/INSTALL.md).
    image: gvenzl/oracle-free:23-slim-faststart
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD}
      APP_USER: JIH_QUEUE
      APP_USER_PASSWORD: ${APP_DB_PASSWORD}
      TZ: Asia/Amman
    ports:
      - "1521:1521"          # remove if the database must not be reachable from other machines
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  app:
    build: .
    image: jih-queue-app:latest
    restart: unless-stopped
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      Storage__Provider: Oracle
      ConnectionStrings__Oracle: "User Id=JIH_QUEUE;Password=${APP_DB_PASSWORD};Data Source=oracle-db:1521/FREEPDB1"
      App__PublicBaseUrl: ${PUBLIC_BASE_URL}
      Qr__Secret: ${QR_SECRET}
      Seed__Enabled: "true"
      Seed__DemoTickets: ${SEED_DEMO_TICKETS:-false}
      Seed__DemoHistory: "true"
      Twilio__AccountSid: ${TWILIO_ACCOUNT_SID:-}
      Twilio__AuthToken: ${TWILIO_AUTH_TOKEN:-}
      Twilio__WhatsAppFrom: ${TWILIO_WHATSAPP_FROM:-+14155238886}
      Twilio__SmsFrom: ${TWILIO_SMS_FROM:-}
      TZ: Asia/Amman
    expose:
      - "8080"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  oracle-data:
